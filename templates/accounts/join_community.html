{% extends "base.html" %}

{% block title %}Join community{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-3">Join a community</h1>
        <p class="text-muted small">Ask a community admin for its join code.</p>
        <form method="post" novalidate>
          {% csrf_token %}
          {% include "includes/form_fields.html" with form=form %}
          <button type="submit" class="btn btn-primary w-100">Join</button>
        </form>
        <p class="text-center mt-3 mb-0"><a href="{% url 'home' %}">Back to my communities</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
