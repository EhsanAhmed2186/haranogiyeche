{% extends "base.html" %}

{% block title %}Notifications{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h1 class="h3 mb-0">Notifications</h1>
  <form method="post" action="{% url 'notifications:mark_all_read' %}">
    {% csrf_token %}
    <button type="submit" class="btn btn-outline-secondary btn-sm">Mark all as read</button>
  </form>
</div>

<div class="list-group">
  {% for item in items %}
    <a href="{% url 'notifications:open' item.pk %}"
       class="list-group-item list-group-item-action {% if not item.is_read %}notif-unread{% endif %}">
      <div>{{ item.message }}</div>
      <div class="small text-muted">{{ item.created_at|timesince }} ago</div>
    </a>
  {% empty %}
    <div class="list-group-item text-center text-muted p-5">You have no notifications.</div>
  {% endfor %}
</div>
{% endblock %}
